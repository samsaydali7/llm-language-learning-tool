spring:
  application:
    name: language-learning-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:language_learning}
    username: ${DB_USER:language_learning}
    password: ${DB_PASSWORD:language_learning_dev}

  jpa:
    hibernate:
      # Flyway (below) is the single source of truth for the schema; Hibernate neither
      # generates nor strictly validates column-level details like varchar lengths against it.
      ddl-auto: none
    # DTO mapping (entity -> *Response) happens in controllers, after the service's read-only
    # transaction has closed; open-in-view keeps a session available for the lazy associations
    # (book.language, knowledgeItem.topics, etc.) those mappers read.
    open-in-view: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        # Measured directly: two concurrent qwen3:8b calls on this hardware (shared unified
        # memory, no discrete GPU) don't run in true parallel - they roughly double each other's
        # latency, which pushed both past the 300s timeout when tried at concurrency 2. A single
        # call reliably finishes in ~130s, so serialized processing is actually faster and more
        # reliable here than "parallel" that isn't really parallel on this hardware.
        concurrency: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: ${SERVER_PORT:8080}

storage:
  base-path: ${STORAGE_BASE_PATH:./data/storage}

extraction:
  max-chunk-chars: ${EXTRACTION_MAX_CHUNK_CHARS:4000}
  audio-reference-patterns:
    - "(?i)track\\s?#?\\d+([-.]\\d+)?"
    - "(?i)cd\\s?\\d+[-.]\\d+"
    - "(?i)piste\\s?\\d+"

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    # No request-timeout-seconds here: OllamaClient uses an indefinite read timeout by design -
    # see its Javadoc. Real 8B-class models on modest hardware (SPEC.md #5's target: a MacBook
    # Air M4, no discrete GPU) take anywhere from ~130s to 300s+ per call depending on chunk size
    # and machine load, so any fixed timeout risks killing a still-working generation.
  extraction:
    provider: ${EXTRACTION_PROVIDER:qwen}
    model: ${EXTRACTION_MODEL:qwen3:8b}
  exercises:
    provider: ${EXERCISE_PROVIDER:llama}
    model: ${EXERCISE_MODEL:llama3.2:3b}
  grammar-review:
    provider: ${GRAMMAR_REVIEW_PROVIDER:llama}
    model: ${GRAMMAR_REVIEW_MODEL:llama3.2:3b}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}

logging:
  level:
    com.languagelearning: INFO
