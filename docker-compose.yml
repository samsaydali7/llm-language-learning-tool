services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: language_learning
      POSTGRES_USER: language_learning
      POSTGRES_PASSWORD: language_learning_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U language_learning -d language_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URLS: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: language_learning
      DB_USER: language_learning
      DB_PASSWORD: language_learning_dev
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-qwen}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-qwen3:8b}
      EXERCISE_PROVIDER: ${EXERCISE_PROVIDER:-llama}
      EXERCISE_MODEL: ${EXERCISE_MODEL:-llama3.2:3b}
      GRAMMAR_REVIEW_PROVIDER: ${GRAMMAR_REVIEW_PROVIDER:-llama}
      GRAMMAR_REVIEW_MODEL: ${GRAMMAR_REVIEW_MODEL:-llama3.2:3b}
      STORAGE_BASE_PATH: /app/data/storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/data/storage

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  rabbitmq_data:
  open_webui_data:
  backend_storage:
